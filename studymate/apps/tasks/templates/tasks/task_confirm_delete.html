
<!-- task_confirm_delete.html -->
{% extends 'basic/dashboard/main_nav.html' %}
{% load static %}

{% block title %}Task{% endblock %}

{% block content %}
<!-- Clean Blue Modal -->
<div class="modal-overlay" id="deleteConfirmModal">
    <div class="modal-content">
        <!-- Close button -->
        <button class="modal-close" onclick="redirectToTaskList()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
        
        <!-- Warning icon -->
        <div class="warning-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="#3b82f6" stroke-width="2"/>
                <path d="M12 8v4M12 16h.01" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>
        
        <!-- Content -->
        <h2>Delete Task</h2>
        <p>Are you sure you want to delete this task?</p>

        <!-- Buttons -->
        <div class="modal-actions">
            <a href="{% url 'tasks:task_list' %}" class="btn-cancel">Cancel</a>
            <form method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="btn-delete">Delete</button>
            </form>
        </div>
    </div>
</div>

<style>
/* Modal overlay */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 10000;
    background: glass;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.2s ease;
}

/* Modal content */
.modal-content {
    position: relative;
    background: white;
    border-radius: 16px;
    padding: 32px;
    width: 400px;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    animation: slideUp 0.3s ease;
    z-index: 10001;
}

/* Close button */
.modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    color: #6b7280;
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    transition: all 0.2s ease;
}

.modal-close:hover {
    color: #374151;
    background: #f3f4f6;
}

/* Warning icon */
.warning-icon {
    margin: 0 auto 24px;
    display: flex;
    justify-content: center;
}

/* Text styling */
h2 {
    color: #1f2937;
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 8px 0;
}

p {
    color: #6b7280;
    font-size: 16px;
    margin: 0 0 24px 0;
}



/* Button container */
.modal-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 32px;
}

/* Buttons */
.btn-cancel, .btn-delete {
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    border: none;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    min-width: 100px;
}

.btn-cancel {
    background: white;
    color: #374151;
    border: 1px solid #d1d5db;
}

.btn-cancel:hover {
    background: #f9fafb;
    border-color: #9ca3af;
}

.btn-delete {
    background: #3b82f6;
    color: white;
}

.btn-delete:hover {
    background: #2563eb;
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideUp {
    from { 
        opacity: 0;
        transform: translateY(20px);
    }
    to { 
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
}

/* Mobile responsive */
@media (max-width: 480px) {
    .modal-content {
        margin: 20px;
        padding: 24px;
    }
    
    .modal-actions {
        flex-direction: column;
    }
    
    .btn-cancel, .btn-delete {
        width: 100%;
    }
}
</style>

<script>
function redirectToTaskList() {
    const modal = document.getElementById('deleteConfirmModal');
    modal.style.animation = 'fadeOut 0.2s ease forwards';
    
    setTimeout(() => {
        window.location.href = '{% url "tasks:task_list" %}';
    }, 200);
}

document.addEventListener('DOMContentLoaded', function() {
    const modal = document.getElementById('deleteConfirmModal');
    
    // Close on backdrop click
    modal.addEventListener('click', function(e) {
        if (e.target === modal) {
            redirectToTaskList();
        }
    });
    
    // Close on escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            redirectToTaskList();
        }
    });
});
</script>
{% endblock %}
