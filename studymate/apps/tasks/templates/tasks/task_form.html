{% extends 'basic/dashboard/main_nav.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Tasks{% endblock %}

{% block content %}
<style>
    .form-container {
        background: linear-gradient(145deg, #f5f7fa, #e4e7eb);
        border-radius: 20px;
        box-shadow: 0 15px 25px rgba(0, 0, 0, 0.1);
        padding: 2.5rem;
        animation: fadeIn 0.6s ease-in-out;
    }

    .form-title {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 1.5rem;
        color: #2c3e50;
    }

    .btn-success, .btn-outline-secondary {
        border-radius: 50px;
        padding: 0.5rem 2rem;
        font-weight: 500;
        font-size: 1rem;
        transition: all 0.3s ease-in-out;
    }

    .btn-success:hover {
        background-color: #0f6b99;
        color: #fff;
        transform: scale(1.05);
    }

    .btn-outline-secondary:hover {
        background-color: #6c757d;
        color: #fff;
        transform: scale(1.05);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="form-container">
                <h1 class="form-title text-center">
                    {% if form.instance.pk %}Update Task{% else %}Create Task{% endif %}
                </h1>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}

                    <div class="d-flex justify-content-between mt-4">
                        <button type="submit" class="btn btn-info">
                            {% if form.instance.pk %}Update{% else %}Create{% endif %}
                        </button>
                        <a href="{% url 'tasks:task_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
